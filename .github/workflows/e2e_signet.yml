name: E2E Signet

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""
  BITCOIND_RPC_URL: "http://127.0.0.1:38332"
  BITCOIND_RPC_USER: "user"
  BITCOIND_RPC_PASS: "passw0rd"

jobs:
  e2e-signet:
    name: E2E Signet Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo registry, bin & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-e2e-signet-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-signet-
            ${{ runner.os }}-cargo-

      - name: Install RocksDB system library
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q librocksdb-dev
            echo "ROCKSDB_LIB_DIR=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)" >> "$GITHUB_ENV"
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            brew install coreutils rocksdb
            echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
            echo "ROCKSDB_LIB_DIR=$(brew --prefix rocksdb)/lib" >> "$GITHUB_ENV"
          else
            echo "Unsupported runner OS: ${RUNNER_OS}" >&2
            exit 1
          fi

      - name: Determine Bitcoin Core archive suffix
        id: bitcoin_arch
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)
              echo "suffix=x86_64-linux-gnu" >> "$GITHUB_OUTPUT"
              ;;
            Linux-ARM64)
              echo "suffix=aarch64-linux-gnu" >> "$GITHUB_OUTPUT"
              ;;
            macOS-X64)
              echo "suffix=x86_64-apple-darwin" >> "$GITHUB_OUTPUT"
              ;;
            macOS-ARM64)
              echo "suffix=arm64-apple-darwin" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported runner OS/arch: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac

      - name: cargo fmt (warn only)
        run: cargo fmt -- --check
        continue-on-error: true

      - name: Detect latest Bitcoin Core stable and RC versions
        id: btc_version
        run: |
          eval "$(./scripts/detect-bitcoin-core-versions.sh)"

          echo "stable_version=${STABLE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "stable_base_url=${STABLE_BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "rc_version=${RC_VERSION}"         >> "$GITHUB_OUTPUT"
          echo "rc_base_url=${RC_BASE_URL}"       >> "$GITHUB_OUTPUT"
          echo "Stable : ${STABLE_VERSION}"
          echo "RC     : ${RC_VERSION}"

      - name: Download and install Bitcoin Core stable binaries
        run: |
          VERSION="${{ steps.btc_version.outputs.stable_version }}"
          BASE_URL="${{ steps.btc_version.outputs.stable_base_url }}"
          ARCH="${{ steps.bitcoin_arch.outputs.suffix }}"
          TARBALL="bitcoin-${VERSION}-${ARCH}.tar.gz"

          echo "Downloading stable ${BASE_URL}/${TARBALL}"
          curl -fsSL -O "${BASE_URL}/${TARBALL}"
          curl -fsSL -O "${BASE_URL}/SHA256SUMS"
          python3 ./scripts/verify-sha256.py "${TARBALL}"

          tar -xzf "${TARBALL}"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            sudo install -m 0755 "bitcoin-${VERSION}/bin/bitcoind" /usr/local/bin/bitcoind
            sudo install -m 0755 "bitcoin-${VERSION}/bin/bitcoin-cli" /usr/local/bin/bitcoin-cli
          else
            sudo install -m 0755 -t /usr/local/bin \
              "bitcoin-${VERSION}/bin/bitcoind" \
              "bitcoin-${VERSION}/bin/bitcoin-cli"
          fi

          echo "Stable bitcoind: $(bitcoind --version | head -1)"

      - name: Download and install Bitcoin Core RC binaries
        run: |
          STABLE="${{ steps.btc_version.outputs.stable_version }}"
          RC="${{ steps.btc_version.outputs.rc_version }}"
          BASE_URL="${{ steps.btc_version.outputs.rc_base_url }}"
          ARCH="${{ steps.bitcoin_arch.outputs.suffix }}"

          if [ "$RC" = "$STABLE" ]; then
            echo "No RC distinct from stable — symlinking stable binaries as *-rc."
            sudo ln -sf /usr/local/bin/bitcoind    /usr/local/bin/bitcoind-rc
            sudo ln -sf /usr/local/bin/bitcoin-cli /usr/local/bin/bitcoin-cli-rc
          else
            TARBALL="bitcoin-${RC}-${ARCH}.tar.gz"

            echo "Downloading RC ${BASE_URL}/${TARBALL}"
            curl -fsSL -O "${BASE_URL}/${TARBALL}"
            curl -fsSL -O "${BASE_URL}/SHA256SUMS"
            python3 ./scripts/verify-sha256.py "${TARBALL}"

            tar -xzf "${TARBALL}"
            if [ "${RUNNER_OS}" = "macOS" ]; then
              sudo install -m 0755 "bitcoin-${RC}/bin/bitcoind" /usr/local/bin/bitcoind-rc
              sudo install -m 0755 "bitcoin-${RC}/bin/bitcoin-cli" /usr/local/bin/bitcoin-cli-rc
            else
              sudo install -m 0755 \
                -T "bitcoin-${RC}/bin/bitcoind"    /usr/local/bin/bitcoind-rc
              sudo install -m 0755 \
                -T "bitcoin-${RC}/bin/bitcoin-cli" /usr/local/bin/bitcoin-cli-rc
            fi
          fi

          echo "RC bitcoind: $(bitcoind-rc --version | head -1)"

      - name: Start stable and RC bitcoind nodes (signet, peered)
        run: |
          set -euo pipefail

          RPC_USER="${BITCOIND_RPC_USER}"
          RPC_PASS="${BITCOIND_RPC_PASS}"

          mkdir -p "$HOME/.bitcoin-stable"
          printf '%s\n' \
            '[signet]' \
            'server=1' \
            'daemon=1' \
            'txindex=1' \
            "rpcuser=${RPC_USER}" \
            "rpcpassword=${RPC_PASS}" \
            'rpcport=38332' \
            'port=38333' \
            'bind=127.0.0.1' \
            > "$HOME/.bitcoin-stable/bitcoin.conf"

          bitcoind -signet -datadir="$HOME/.bitcoin-stable"
          echo "Stable bitcoind started."
          for i in $(seq 1 30); do
            if bitcoin-cli -signet \
                -rpcuser="${RPC_USER}" -rpcpassword="${RPC_PASS}" \
                -rpcport=38332 getblockchaininfo > /dev/null 2>&1; then
              echo "Stable bitcoind RPC ready (attempt ${i})"
              break
            fi
            echo "Waiting for stable bitcoind RPC... (${i}/30)"
            sleep 1
          done
          if ! bitcoin-cli -signet \
              -rpcuser="${RPC_USER}" -rpcpassword="${RPC_PASS}" \
              -rpcport=38332 getblockchaininfo > /dev/null 2>&1; then
            echo "Stable bitcoind RPC did not become ready before RC start" >&2
            exit 1
          fi

          mkdir -p "$HOME/.bitcoin-rc"
          printf '%s\n' \
            '[signet]' \
            'server=1' \
            'daemon=1' \
            'txindex=1' \
            "rpcuser=${RPC_USER}" \
            "rpcpassword=${RPC_PASS}" \
            'rpcport=38334' \
            'port=38335' \
            'bind=127.0.0.1' \
            'connect=127.0.0.1:38333' \
            > "$HOME/.bitcoin-rc/bitcoin.conf"

          bitcoind-rc -signet -datadir="$HOME/.bitcoin-rc"
          echo "RC bitcoind started."

          echo "BITCOIND_STABLE_DATADIR=$HOME/.bitcoin-stable" >> "$GITHUB_ENV"
          echo "BITCOIND_RC_DATADIR=$HOME/.bitcoin-rc" >> "$GITHUB_ENV"

          for PORT in 38332 38334; do
            for i in $(seq 1 60); do
              if bitcoin-cli -signet \
                  -rpcuser="${RPC_USER}" -rpcpassword="${RPC_PASS}" \
                  -rpcport="${PORT}" getblockchaininfo > /dev/null 2>&1; then
                echo "bitcoind on port ${PORT} ready (attempt ${i})"
                break
              fi
              echo "Waiting for bitcoind on port ${PORT}... (${i}/60)"
              sleep 1
            done
            if ! bitcoin-cli -signet \
                -rpcuser="${RPC_USER}" -rpcpassword="${RPC_PASS}" \
                -rpcport="${PORT}" getblockchaininfo > /dev/null 2>&1; then
              echo "bitcoind on port ${PORT} did not become ready" >&2
              exit 1
            fi
          done

          echo "=== Stable node chain ==="
          bitcoin-cli -signet \
            -rpcuser="${RPC_USER}" -rpcpassword="${RPC_PASS}" \
            -rpcport=38332 getblockchaininfo

          echo "=== RC node chain ==="
          bitcoin-cli -signet \
            -rpcuser="${RPC_USER}" -rpcpassword="${RPC_PASS}" \
            -rpcport=38334 getblockchaininfo

      - name: cargo build
        run: cargo build --all-targets

      - name: Exercise bridge binary
        run: |
          set -euo pipefail

          set +e
          timeout 20s cargo run --bin nakamoto-electrs -- \
            --network signet \
            --peer 127.0.0.1:38333 \
            --listen 127.0.0.1:60401
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

      - name: Exercise all examples sequentially
        run: |
          set -euo pipefail

          set +e
          timeout 10s cargo run --example nakamoto
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

          ELECTRS_CONF="$RUNNER_TEMP/electrs-signet.toml"
          python3 - "$ELECTRS_CONF" "$HOME/.bitcoin-stable" "${BITCOIND_RPC_USER}" "${BITCOIND_RPC_PASS}" <<'PY'
          from pathlib import Path
          import sys

          config_path = Path(sys.argv[1])
          daemon_dir = sys.argv[2]
          rpc_user = sys.argv[3]
          rpc_pass = sys.argv[4]
          config_path.write_text(
              f'network = "signet"\n'
              f'daemon_dir = "{daemon_dir}"\n'
              f'auth = "{rpc_user}:{rpc_pass}"\n'
          )
          PY
          set +e
          timeout 10s cargo run --features electrs-bin --example electrs -- \
            --conf "$ELECTRS_CONF"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

      - name: Run e2e signet tests (nocapture)
        run: |
          cargo test --test e2e_signet -- --ignored --nocapture

      - name: Stop bitcoind nodes
        if: always()
        run: |
          bitcoin-cli -signet \
            -rpcuser="${BITCOIND_RPC_USER}" \
            -rpcpassword="${BITCOIND_RPC_PASS}" \
            -rpcport=38332 \
            stop || true
          bitcoin-cli -signet \
            -rpcuser="${BITCOIND_RPC_USER}" \
            -rpcpassword="${BITCOIND_RPC_PASS}" \
            -rpcport=38334 \
            stop || true
