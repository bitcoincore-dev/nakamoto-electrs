name: E2E Regtest

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""
  BITCOIND_RPC_URL: "http://127.0.0.1:18443"
  BITCOIND_RPC_USER: "user"
  BITCOIND_RPC_PASS: "passw0rd"

jobs:
  e2e-regtest:
    name: E2E Regtest Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-

      - name: Install RocksDB system library
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q librocksdb-dev
          echo "ROCKSDB_LIB_DIR=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)" >> "$GITHUB_ENV"

      - name: cargo fmt (warn only)
        run: cargo fmt -- --check
        continue-on-error: true

      # ---------------------------------------------------------------------------
      # Detect stable release + most-recent RC from Bitcoin Core GitHub releases.
      # Outputs: stable_version, rc_version (may equal stable_version if no RC).
      # ---------------------------------------------------------------------------
      - name: Detect latest Bitcoin Core stable and RC versions
        id: btc_version
        run: |
          # Fetch the 30 most recent releases (includes prereleases / RCs).
          RELEASES=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/bitcoin/bitcoin/releases?per_page=30")

          # Emit both stable_version and rc_version.
          eval "$(echo "$RELEASES" | python3 -c 'import json, sys, re; releases = json.load(sys.stdin); non_draft = [r for r in releases if not r.get("draft", False)]; non_draft.sort(key=lambda r: r.get("published_at", ""), reverse=True); assert non_draft, "No Bitcoin Core releases found"; is_rc = lambda r: r.get("prerelease", False) or re.search(r"rc\d+$", r.get("tag_name", ""), re.IGNORECASE); stable = next((r for r in non_draft if not is_rc(r)), None); rc = next((r for r in non_draft if is_rc(r)), None); stable_ver = stable["tag_name"].lstrip("v") if stable else non_draft[0]["tag_name"].lstrip("v"); rc_ver = rc["tag_name"].lstrip("v") if rc else stable_ver; print(f"STABLE_VERSION={stable_ver}"); print(f"RC_VERSION={rc_ver}")')"

          echo "stable_version=${STABLE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "rc_version=${RC_VERSION}"         >> "$GITHUB_OUTPUT"
          echo "Stable : ${STABLE_VERSION}"
          echo "RC     : ${RC_VERSION}"

      # ---------------------------------------------------------------------------
      # Install Bitcoin Core binaries (stable → default names; RC → *-rc suffix)
      # ---------------------------------------------------------------------------
      - name: Download and install Bitcoin Core stable binaries
        run: |
          VERSION="${{ steps.btc_version.outputs.stable_version }}"
          ARCH="x86_64-linux-gnu"
          TARBALL="bitcoin-${VERSION}-${ARCH}.tar.gz"
          BASE_URL="https://bitcoincore.org/bin/bitcoin-core-${VERSION}"

          echo "Downloading stable ${BASE_URL}/${TARBALL}"
          curl -fsSL -O "${BASE_URL}/${TARBALL}"
          curl -fsSL -O "${BASE_URL}/SHA256SUMS"
          grep "${TARBALL}" SHA256SUMS | sha256sum --check --status

          tar -xzf "${TARBALL}"
          sudo install -m 0755 -t /usr/local/bin \
            "bitcoin-${VERSION}/bin/bitcoind" \
            "bitcoin-${VERSION}/bin/bitcoin-cli"

          echo "Stable bitcoind: $(bitcoind --version | head -1)"

      - name: Download and install Bitcoin Core RC binaries
        run: |
          STABLE="${{ steps.btc_version.outputs.stable_version }}"
          RC="${{ steps.btc_version.outputs.rc_version }}"
          ARCH="x86_64-linux-gnu"

          if [ "$RC" = "$STABLE" ]; then
            echo "No RC distinct from stable — symlinking stable binaries as *-rc."
            sudo ln -sf /usr/local/bin/bitcoind    /usr/local/bin/bitcoind-rc
            sudo ln -sf /usr/local/bin/bitcoin-cli /usr/local/bin/bitcoin-cli-rc
          else
            TARBALL="bitcoin-${RC}-${ARCH}.tar.gz"
            BASE_URL="https://bitcoincore.org/bin/bitcoin-core-${RC}"

            echo "Downloading RC ${BASE_URL}/${TARBALL}"
            curl -fsSL -O "${BASE_URL}/${TARBALL}"
            curl -fsSL -O "${BASE_URL}/SHA256SUMS"
            grep "${TARBALL}" SHA256SUMS | sha256sum --check --status

            tar -xzf "${TARBALL}"
            sudo install -m 0755 \
              -T "bitcoin-${RC}/bin/bitcoind"    /usr/local/bin/bitcoind-rc
            sudo install -m 0755 \
              -T "bitcoin-${RC}/bin/bitcoin-cli" /usr/local/bin/bitcoin-cli-rc
          fi

          echo "RC bitcoind: $(bitcoind-rc --version | head -1)"

      # ---------------------------------------------------------------------------
      # Start both nodes in regtest and peer them together
      #   stable node : P2P 18444 / RPC 18443  (BITCOIND_RPC_URL target)
      #   RC node     : P2P 18446 / RPC 18445  (connects to stable)
      # ---------------------------------------------------------------------------
      - name: Start stable and RC bitcoind nodes (regtest, peered)
        run: |
          set -euo pipefail

          RPC_USER="${BITCOIND_RPC_USER}"
          RPC_PASS="${BITCOIND_RPC_PASS}"

          # ── stable node ──────────────────────────────────────────────────────
          mkdir -p "$HOME/.bitcoin-stable"
          printf '%s\n' \
            '[regtest]' \
            'server=1' \
            'daemon=1' \
            'txindex=1' \
            'fallbackfee=0.0001' \
            "rpcuser=${RPC_USER}" \
            "rpcpassword=${RPC_PASS}" \
            'rpcport=18443' \
            'port=18444' \
            'bind=127.0.0.1' \
            > "$HOME/.bitcoin-stable/bitcoin.conf"

          bitcoind -regtest -datadir="$HOME/.bitcoin-stable"
          echo "Stable bitcoind started."

          # ── RC node ──────────────────────────────────────────────────────────
          mkdir -p "$HOME/.bitcoin-rc"
          printf '%s\n' \
            '[regtest]' \
            'server=1' \
            'daemon=1' \
            'txindex=1' \
            'fallbackfee=0.0001' \
            "rpcuser=${RPC_USER}" \
            "rpcpassword=${RPC_PASS}" \
            'rpcport=18445' \
            'port=18446' \
            'bind=127.0.0.1' \
            'connect=127.0.0.1:18444' \
            > "$HOME/.bitcoin-rc/bitcoin.conf"

          bitcoind-rc -regtest -datadir="$HOME/.bitcoin-rc"
          echo "RC bitcoind started."

          # ── Wait for both RPC endpoints ───────────────────────────────────────
          for PORT in 18443 18445; do
            for i in $(seq 1 30); do
              if bitcoin-cli -regtest \
                  -rpcuser="${RPC_USER}" -rpcpassword="${RPC_PASS}" \
                  -rpcport="${PORT}" getblockchaininfo > /dev/null 2>&1; then
                echo "bitcoind on port ${PORT} ready (attempt ${i})"
                break
              fi
              echo "Waiting for bitcoind on port ${PORT}... (${i}/30)"
              sleep 1
            done
            if ! bitcoin-cli -regtest \
                -rpcuser="${RPC_USER}" -rpcpassword="${RPC_PASS}" \
                -rpcport="${PORT}" getblockchaininfo > /dev/null 2>&1; then
              echo "bitcoind on port ${PORT} did not become ready" >&2
              exit 1
            fi
          done

          # ── Verify peering ────────────────────────────────────────────────────
          echo "=== Stable node peers ==="
          STABLE_PEER_COUNT=$(bitcoin-cli -regtest \
            -rpcuser="${RPC_USER}" -rpcpassword="${RPC_PASS}" \
            -rpcport=18443 getpeerinfo | python3 -c "import json, sys; print(len(json.load(sys.stdin)))")
          echo "Stable node sees ${STABLE_PEER_COUNT} peer(s)"
          bitcoin-cli -regtest \
            -rpcuser="${RPC_USER}" -rpcpassword="${RPC_PASS}" \
            -rpcport=18443 getpeerinfo | python3 -c 'import json, sys; peers = json.load(sys.stdin); print("\n".join("  {} {}".format(p.get("addr", "?"), p.get("subver", "?")) for p in peers))'
          if [ "${STABLE_PEER_COUNT}" -lt 1 ]; then
            echo "Stable node is not connected to RC" >&2
            exit 1
          fi

          echo "=== RC node peers ==="
          RC_PEER_COUNT=$(bitcoin-cli -regtest \
            -rpcuser="${RPC_USER}" -rpcpassword="${RPC_PASS}" \
            -rpcport=18445 getpeerinfo | python3 -c "import json, sys; print(len(json.load(sys.stdin)))")
          echo "RC node sees ${RC_PEER_COUNT} peer(s)"
          bitcoin-cli -regtest \
            -rpcuser="${RPC_USER}" -rpcpassword="${RPC_PASS}" \
            -rpcport=18445 getpeerinfo | python3 -c 'import json, sys; peers = json.load(sys.stdin); print("\n".join("  {} {}".format(p.get("addr", "?"), p.get("subver", "?")) for p in peers))'
          if [ "${RC_PEER_COUNT}" -lt 1 ]; then
            echo "RC node is not connected to stable" >&2
            exit 1
          fi

          # ── Print chain info for both ─────────────────────────────────────────
          echo "=== Stable node chain ==="
          bitcoin-cli -regtest \
            -rpcuser="${RPC_USER}" -rpcpassword="${RPC_PASS}" \
            -rpcport=18443 getblockchaininfo

          echo "=== RC node chain ==="
          bitcoin-cli -regtest \
            -rpcuser="${RPC_USER}" -rpcpassword="${RPC_PASS}" \
            -rpcport=18445 getblockchaininfo

      # ---------------------------------------------------------------------------
      # Build the project and run the e2e regtest tests
      # ---------------------------------------------------------------------------
      - name: cargo build
        run: cargo build --all-targets

      - name: Exercise all bins
        run: |
          set -euo pipefail

          # Main bridge binary on regtest (expects to keep running until timeout).
          set +e
          timeout 20s cargo run --bin nakamoto-electrs -- \
            --network regtest \
            --peer 127.0.0.1:18444 \
            --listen 127.0.0.1:60401
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

          # Standalone nakamoto binary (long-running service; timeout is expected).
          set +e
          timeout 10s cargo run --bin nakamoto
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

          # Standalone electrs binary (feature-gated).
          cargo run --features electrs-bin --bin electrs -- --help

      - name: Run e2e regtest tests (nocapture)
        run: |
          cargo test --test e2e_regtest -- --ignored --nocapture

      # ---------------------------------------------------------------------------
      # Cleanup
      # ---------------------------------------------------------------------------
      - name: Stop bitcoind nodes
        if: always()
        run: |
          bitcoin-cli -regtest \
            -rpcuser="${BITCOIND_RPC_USER}" \
            -rpcpassword="${BITCOIND_RPC_PASS}" \
            -rpcport=18443 \
            stop || true
          bitcoin-cli -regtest \
            -rpcuser="${BITCOIND_RPC_USER}" \
            -rpcpassword="${BITCOIND_RPC_PASS}" \
            -rpcport=18445 \
            stop || true
