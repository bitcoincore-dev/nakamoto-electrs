name: E2E Regtest

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""
  BITCOIND_RPC_URL: "http://127.0.0.1:18443"
  BITCOIND_RPC_USER: "user"
  BITCOIND_RPC_PASS: "passw0rd"

jobs:
  e2e-regtest:
    name: E2E Regtest Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-

      - name: Install RocksDB system library
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q librocksdb-dev
          echo "ROCKSDB_LIB_DIR=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)" >> "$GITHUB_ENV"

      - name: cargo fmt (warn only)
        run: cargo fmt -- --check
        continue-on-error: true

      # ---------------------------------------------------------------------------
      # Detect and install the latest Bitcoin Core prebuilt binaries
      # Prefers the most-recently published release, including release candidates
      # (tagged as vX.Y.ZrcN and marked prerelease on GitHub).
      # ---------------------------------------------------------------------------
      - name: Detect latest Bitcoin Core release (including RCs)
        id: btc_version
        run: |
          # Fetch the 30 most recent releases (includes prereleases / RCs).
          RELEASES=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/bitcoin/bitcoin/releases?per_page=30")

          # Extract the tag_name from the most-recently *published* entry.
          # jq sorts by published_at descending and takes the first non-draft entry.
          VERSION=$(echo "$RELEASES" \
            | python3 -c "
import json, sys
releases = json.load(sys.stdin)
# Filter out drafts; include both stable and RC (prerelease) entries
candidates = [r for r in releases if not r.get('draft', False)]
# Sort by published_at descending
candidates.sort(key=lambda r: r.get('published_at', ''), reverse=True)
if not candidates:
    sys.exit('No Bitcoin Core releases found')
tag = candidates[0]['tag_name']          # e.g. 'v29.0rc2' or 'v28.1'
version = tag.lstrip('v')               # strip leading 'v'
print(version)
")

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected Bitcoin Core version: ${VERSION}"

          # Emit a human-readable label so CI logs are easy to read.
          if echo "${VERSION}" | grep -qiE 'rc[0-9]+$'; then
            echo "This is a RELEASE CANDIDATE: ${VERSION}"
          else
            echo "This is a STABLE release: ${VERSION}"
          fi

      - name: Download and install Bitcoin Core binaries
        run: |
          VERSION="${{ steps.btc_version.outputs.version }}"
          ARCH="x86_64-linux-gnu"
          TARBALL="bitcoin-${VERSION}-${ARCH}.tar.gz"
          BASE_URL="https://bitcoincore.org/bin/bitcoin-core-${VERSION}"

          echo "Downloading ${BASE_URL}/${TARBALL}"
          curl -fsSL -O "${BASE_URL}/${TARBALL}"
          curl -fsSL -O "${BASE_URL}/SHA256SUMS"
          curl -fsSL -O "${BASE_URL}/SHA256SUMS.asc" || true   # gpg check is optional in CI

          # Verify checksum
          grep "${TARBALL}" SHA256SUMS | sha256sum --check --status

          tar -xzf "${TARBALL}"
          sudo install -m 0755 -t /usr/local/bin \
            "bitcoin-${VERSION}/bin/bitcoind" \
            "bitcoin-${VERSION}/bin/bitcoin-cli"

          bitcoind --version

      # ---------------------------------------------------------------------------
      # Configure and start bitcoind in regtest mode
      # ---------------------------------------------------------------------------
      - name: Configure and start bitcoind (regtest)
        run: |
          mkdir -p "$HOME/.bitcoin"
          cat > "$HOME/.bitcoin/bitcoin.conf" <<'EOF'
          [regtest]
          server=1
          daemon=1
          txindex=1
          fallbackfee=0.0001
          EOF

          bitcoind -regtest \
            -rpcuser="${BITCOIND_RPC_USER}" \
            -rpcpassword="${BITCOIND_RPC_PASS}" \
            -rpcport=18443

          # Wait until the RPC is ready
          for i in $(seq 1 30); do
            if bitcoin-cli -regtest \
                -rpcuser="${BITCOIND_RPC_USER}" \
                -rpcpassword="${BITCOIND_RPC_PASS}" \
                -rpcport=18443 \
                getblockchaininfo > /dev/null 2>&1; then
              echo "bitcoind is ready (attempt ${i})"
              break
            fi
            echo "Waiting for bitcoind... (attempt ${i}/30)"
            sleep 1
          done

          bitcoin-cli -regtest \
            -rpcuser="${BITCOIND_RPC_USER}" \
            -rpcpassword="${BITCOIND_RPC_PASS}" \
            -rpcport=18443 \
            getblockchaininfo

      # ---------------------------------------------------------------------------
      # Build the project and run the e2e regtest tests
      # ---------------------------------------------------------------------------
      - name: cargo build
        run: cargo build --all-targets

      - name: Exercise all bins
        run: |
          set -euo pipefail

          # Main bridge binary on regtest (expects to keep running until timeout).
          set +e
          timeout 20s cargo run --bin nakamoto-electrs -- \
            --network regtest \
            --peer 127.0.0.1:18444 \
            --listen 127.0.0.1:60401
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

          # Standalone nakamoto binary (long-running service; timeout is expected).
          set +e
          timeout 10s cargo run --bin nakamoto
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

          # Standalone electrs binary (feature-gated).
          cargo run --features electrs-bin --bin electrs -- --help

      - name: Run e2e regtest tests (nocapture)
        run: |
          cargo test --test e2e_regtest -- --ignored --nocapture

      # ---------------------------------------------------------------------------
      # Cleanup
      # ---------------------------------------------------------------------------
      - name: Stop bitcoind
        if: always()
        run: |
          bitcoin-cli -regtest \
            -rpcuser="${BITCOIND_RPC_USER}" \
            -rpcpassword="${BITCOIND_RPC_PASS}" \
            -rpcport=18443 \
            stop || true
