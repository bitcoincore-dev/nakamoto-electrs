[package]
name = "nakamoto-electrs"
version = "0.0.1"
edition = "2024"
default-run = "nakamoto-electrs"

[dependencies]
anyhow = "1.0"
bitcoin = "0.29.2"
crossbeam-channel = "0.5"
electrs = "0.10.10"
nakamoto-chain = "0.4"
nakamoto-client = "0.4"
nakamoto-net-poll = "0.4"
nakamoto-node = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
