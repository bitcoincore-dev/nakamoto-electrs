[package]
name = "nakamoto-electrs"
version = "0.0.2"
edition = "2024"
default-run = "nakamoto-electrs"

[dependencies]
anyhow = "1.0"
bitcoin = "0.30"
crossbeam-channel = "0.5"
electrs = { version = "0.10.10", default-features = false }
nakamoto-chain = "0.4"
nakamoto-client = "0.4"
nakamoto-net-poll = "0.4"
nakamoto-node = "0.4"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
