[package]
name = "nakamoto-electrs"
version = "0.0.10"
edition = "2024"
default-run = "nakamoto-electrs"

[features]
# Enable the standalone `electrs` binary (requires librocksdb at link time).
electrs-bin = ["dep:electrs"]

[dependencies]
anyhow = "1.0"
bitcoin = "0.32.102"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
ctrlc = "3.4"
electrs = { version = "0.10.10", default-features = false, optional = true }
hex = "0.4"
nakamoto-chain = { git = "https://github.com/bitcoincore-dev/nakamoto", rev = "5ffebc60bf35585c096943ea9d4c4cfc9e454a20" }
nakamoto-client = { git = "https://github.com/bitcoincore-dev/nakamoto", rev = "5ffebc60bf35585c096943ea9d4c4cfc9e454a20" }
nakamoto-common = { git = "https://github.com/bitcoincore-dev/nakamoto", rev = "5ffebc60bf35585c096943ea9d4c4cfc9e454a20" }
nakamoto-net-poll = { git = "https://github.com/bitcoincore-dev/nakamoto", rev = "5ffebc60bf35585c096943ea9d4c4cfc9e454a20" }
nakamoto-node = { git = "https://github.com/bitcoincore-dev/nakamoto", rev = "5ffebc60bf35585c096943ea9d4c4cfc9e454a20" }
serde_json = "1.0"
sled = "0.34"
tempfile = "3.23"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
nakamoto-p2p = { git = "https://github.com/bitcoincore-dev/nakamoto", rev = "5ffebc60bf35585c096943ea9d4c4cfc9e454a20" }

[[example]]
name = "electrs"
path = "examples/electrs.rs"
required-features = ["electrs-bin"]

[[example]]
name = "nakamoto"
path = "examples/nakamoto.rs"

[profile.dev]
debug = 0
debug-assertions = false
strip = "debuginfo"

[profile.test]
overflow-checks = false

[profile.release]
debug = 0
debug-assertions = false
strip = "debuginfo"
lto = "thin"
codegen-units = 1
