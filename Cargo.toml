[package]
name = "nakamoto-electrs"
version = "0.0.3"
edition = "2024"
default-run = "nakamoto-electrs"

[[example]]
name = "electrs"
path = "examples/electrs.rs"
required-features = ["electrs-bin"]

[[example]]
name = "nakamoto"
path = "examples/nakamoto.rs"

[features]
# Enable the standalone `electrs` binary (requires librocksdb at link time).
electrs-bin = []

[dependencies]
anyhow = "1.0"
bitcoin = "0.32.102"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
electrs = { version = "0.10.10", default-features = false }
hex = "0.4"
nakamoto-chain = "0.4"
nakamoto-client = "0.4"
nakamoto-common = "0.4"
nakamoto-net-poll = "0.4"
nakamoto-node = "0.4"
sled = "0.34"
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3.23"
